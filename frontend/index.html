<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaFi Data Query</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f5f5;
    color: #222;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }

  #header {
    background: #1a1a2e; color: #fff; padding: 14px 24px;
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
  }
  #header h1 { font-size: 16px; font-weight: 600; }
  #header .sub { font-size: 12px; color: #888; }

  #chat {
    flex: 1; overflow-y: auto; padding: 20px 24px;
    display: flex; flex-direction: column; gap: 16px;
  }

  .msg {
    max-width: 720px; padding: 12px 16px; border-radius: 8px;
    font-size: 14px; line-height: 1.5;
  }
  .msg.user {
    background: #1a1a2e; color: #fff; align-self: flex-end;
    border-bottom-right-radius: 2px;
  }
  .msg.bot {
    background: #fff; color: #222; align-self: flex-start;
    border: 1px solid #e0e0e0; border-bottom-left-radius: 2px;
  }
  .msg.bot .label {
    font-size: 11px; font-weight: 600; color: #1a1a2e; text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 6px;
  }
  .msg.bot .response { white-space: pre-wrap; }
  .msg.bot .meta {
    font-size: 11px; color: #888; margin-top: 8px; padding-top: 8px;
    border-top: 1px solid #eee;
  }

  #input-area {
    border-top: 1px solid #e0e0e0; padding: 14px 24px;
    display: flex; gap: 10px; background: #fff; flex-shrink: 0;
  }
  #input-area input {
    flex: 1; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px;
    font-size: 14px; outline: none; transition: border 0.2s;
  }
  #input-area input:focus { border-color: #1a1a2e; }
  #input-area button {
    padding: 10px 24px; background: #1a1a2e; color: #fff; border: none;
    border-radius: 6px; font-size: 14px; cursor: pointer; transition: background 0.2s;
  }
  #input-area button:hover { background: #16213e; }
  #input-area button:disabled { opacity: 0.5; cursor: default; }

  #welcome {
    text-align: center; color: #888; padding: 40px 20px;
  }
  #welcome h2 { font-size: 18px; color: #333; margin-bottom: 8px; }
  #welcome p { font-size: 13px; line-height: 1.6; }

  .typing {
    display: inline-flex; align-items: center; gap: 4px;
  }
  .typing span {
    width: 6px; height: 6px; background: #888; border-radius: 50%;
    animation: bounce 1.4s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-4px); }
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 2px; }

  @media (max-width: 600px) {
    #chat { padding: 12px 16px; }
    #input-area { padding: 10px 16px; }
    .msg { max-width: 100%; }
  }
</style>
</head>
<body>
<div id="header">
  <h1>NovaFi Data Query</h1>
  <span class="sub">exfiltrated corporate dataset · 2004 emails · 51 employees · 250 customers</span>
</div>

<div id="chat">
  <div id="welcome">
    <h2>Ask a question about the data</h2>
    <p>Try: <em>"who is the boss"</em> · <em>"what is the company hiding"</em> · <em>"who is in trouble"</em> · <em>"show employee salaries"</em> · <em>"what happened with the data breach"</em></p>
  </div>
</div>

<div id="input-area">
  <input type="text" id="input" placeholder="Ask a question about the dataset..." autofocus spellcheck="false" autocomplete="off">
  <button id="send">Send</button>
</div>

<script>
  const chat = document.getElementById('chat');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const welcome = document.getElementById('welcome');

  function addMessage(text, role) {
    if (welcome) welcome.remove();
    const div = document.createElement('div');
    div.className = 'msg ' + role;

    if (role === 'user') {
      div.textContent = text;
    } else {
      div.innerHTML = '<div class="label">NovaFi</div><div class="response">' + text + '</div>';
    }

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function addBotMessage(text, meta) {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.innerHTML = '<div class="label">NovaFi</div><div class="response">' + escapeHtml(text) + '</div>';
    if (meta) {
      div.innerHTML += '<div class="meta">' + meta + '</div>';
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typing-indicator';
    div.innerHTML = '<div class="label">NovaFi</div><div class="typing"><span></span><span></span><span></span></div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendQuery(query) {
    if (!query.trim()) return;
    input.value = '';
    addMessage(query, 'user');
    showTyping();
    sendBtn.disabled = true;

    try {
      const res = await fetch('/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, use_llm: false })
      });
      const data = await res.json();
      removeTyping();

      let formatted = data.response;
      let meta = data.emails_found + ' relevant emails · ' + data.records_found + ' database records';
      addBotMessage(formatted, meta);

    } catch (err) {
      removeTyping();
      addBotMessage('[Error] Failed to query the dataset: ' + err.message);
    }

    sendBtn.disabled = false;
    input.focus();
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendQuery(input.value);
  });
  sendBtn.addEventListener('click', () => sendQuery(input.value));
</script>
</body>
</html>
