<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaFi Phantom — Terminal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #c0c0c0;
    font-family: 'JetBrains Mono', monospace;
    height: 100vh; overflow: hidden;
  }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #111; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

  /* Layout */
  #app { display: flex; height: 100vh; }
  #sidebar {
    width: 300px; background: #0d0d0d; border-right: 1px solid #1a1a1a;
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  /* Header */
  #header {
    background: #0f0f0f; border-bottom: 1px solid #1a1a1a;
    padding: 10px 20px; display: flex; align-items: center; gap: 16px;
    flex-shrink: 0; height: 48px;
  }
  #header .logo { color: #00ff41; font-weight: 700; font-size: 15px; letter-spacing: 2px; }
  #header .logo span { color: #ff0040; }
  #header .sub { color: #555; font-size: 11px; }
  #header .status { margin-left: auto; font-size: 10px; color: #555; }
  #header .status .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
  #header .status .dot.online { background: #00ff41; box-shadow: 0 0 6px #00ff41; }

  /* Terminal Output */
  #terminal {
    flex: 1; overflow-y: auto; padding: 16px 20px; font-size: 13px; line-height: 1.7;
  }
  #terminal .msg { margin: 2px 0; white-space: pre-wrap; word-break: break-word; }
  #terminal .msg .ts { color: #444; font-size: 10px; margin-right: 8px; }
  #terminal .msg.user { color: #00ff41; }
  #terminal .msg.user::before { content: '> '; color: #00ff41; }
  #terminal .msg.system { color: #888; }
  #terminal .msg.dim { color: #555; }
  #terminal .msg.info { color: #0ff; }
  #terminal .msg.warning { color: #ff0; }
  #terminal .msg.danger { color: #ff3355; }
  #terminal .msg.confidential { color: #ff8800; }
  #terminal .msg .label {
    display: inline-block; font-size: 9px; padding: 0 6px; border-radius: 2px;
    margin-right: 6px; text-transform: uppercase; letter-spacing: 1px;
  }
  #terminal .msg .label.sec { background: #ff335533; color: #ff3355; }
  #terminal .msg .label.fin { background: #ff880033; color: #ff8800; }
  #terminal .msg .label.hr { background: #0ff33; color: #0ff; }
  #terminal .msg .label.conf { background: #ff004033; color: #ff0040; }
  #terminal .msg.email-result {
    border-left: 2px solid #ffffff11; padding-left: 12px; margin: 6px 0; color: #aaa;
  }
  #terminal .divider {
    border: none; border-top: 1px solid #1a1a1a; margin: 8px 0;
  }

  /* Input */
  #input-area {
    border-top: 1px solid #1a1a1a; padding: 10px 20px;
    display: flex; align-items: center; gap: 8px; background: #0f0f0f; flex-shrink: 0;
  }
  #input-area .prompt { color: #00ff41; font-size: 13px; }
  #input-area input {
    flex: 1; background: transparent; border: none; color: #c0c0c0;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; outline: none;
  }
  #input-area input::placeholder { color: #333; }
  #input-area .send-btn {
    background: #00ff4111; border: 1px solid #00ff4133; color: #00ff41;
    padding: 4px 12px; font-family: inherit; font-size: 11px; cursor: pointer;
    border-radius: 3px; transition: all 0.2s;
  }
  #input-area .send-btn:hover { background: #00ff4122; border-color: #00ff4166; }

  /* Loading animation */
  .loading-dots::after {
    content: ''; animation: dots 1.5s steps(4, end) infinite;
  }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

  /* Sidebar */
  #sidebar-header {
    padding: 12px 16px; border-bottom: 1px solid #1a1a1a; font-size: 10px;
    color: #555; text-transform: uppercase; letter-spacing: 2px; flex-shrink: 0;
  }
  #sidebar-content { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .panel { margin-bottom: 16px; }
  .panel h3 {
    font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 2px;
    margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid #1a1a1a;
  }
  .secret-item {
    padding: 6px 8px; margin: 2px 0; border-left: 2px solid #333;
    font-size: 11px; cursor: pointer; transition: all 0.2s;
    border-radius: 0 3px 3px 0;
  }
  .secret-item:hover { background: #111; }
  .secret-item.found { border-left-color: #00ff41; color: #00ff41; }
  .secret-item .diff { font-size: 9px; color: #555; margin-left: 4px; }
  .secret-item .diff.easy { color: #0f0; }
  .secret-item .diff.medium { color: #ff0; }
  .secret-item .diff.hard { color: #f44; }
  .secret-item .desc { font-size: 10px; color: #666; margin-top: 2px; display: none; }
  .secret-item.found .desc { display: block; }

  .stat-box {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
  }
  .stat-item {
    background: #0f0f0f; padding: 6px 8px; border-radius: 3px; text-align: center;
  }
  .stat-item .num { font-size: 16px; color: #00ff41; font-weight: 700; }
  .stat-item .lbl { font-size: 9px; color: #555; }

  .suggestions { display: flex; flex-wrap: wrap; gap: 4px; }
  .suggestions button {
    background: #111; border: 1px solid #222; color: #666;
    padding: 3px 8px; font-family: inherit; font-size: 10px; cursor: pointer;
    border-radius: 3px; transition: all 0.2s;
  }
  .suggestions button:hover { border-color: #00ff4133; color: #00ff41; }

  /* Secrets Found notification */
  #toast {
    position: fixed; bottom: 80px; right: 320px; background: #00ff4111;
    border: 1px solid #00ff4133; color: #00ff41; padding: 8px 16px;
    font-size: 11px; border-radius: 3px; opacity: 0; transition: opacity 0.3s;
    pointer-events: none;
  }
  #toast.show { opacity: 1; }

  @media (max-width: 768px) {
    #sidebar { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- Terminal Panel -->
  <div id="main">
    <div id="header">
      <div class="logo">NOVA<span>Fi</span> PHANTOM</div>
      <div class="sub">// data exfiltration terminal v2.1</div>
      <div class="status"><span class="dot online"></span>DB ONLINE · 2004 emails · 51 employees</div>
    </div>
    <div id="terminal"></div>
    <div id="input-area">
      <span class="prompt">$</span>
      <input type="text" id="query-input" placeholder="query the exfiltrated dataset..." autofocus spellcheck="false" autocomplete="off" />
      <button class="send-btn" id="send-btn">RUN</button>
    </div>
  </div>

  <!-- Sidebar -->
  <div id="sidebar">
    <div id="sidebar-header">Intelligence Dashboard</div>
    <div id="sidebar-content">
      <div class="panel">
        <h3>Operation Status</h3>
        <div class="stat-box">
          <div class="stat-item"><div class="num" id="stat-queries">0</div><div class="lbl">Queries</div></div>
          <div class="stat-item"><div class="num" id="stat-secrets">0/12</div><div class="lbl">Secrets</div></div>
          <div class="stat-item"><div class="num" id="stat-emails">0</div><div class="lbl">Emails</div></div>
          <div class="stat-item"><div class="num" id="stat-records">0</div><div class="lbl">Records</div></div>
        </div>
      </div>

      <div class="panel">
        <h3>Planted Secrets</h3>
        <div id="secrets-list"></div>
      </div>

      <div class="panel">
        <h3>Quick Queries</h3>
        <div class="suggestions">
          <button onclick="runQuery('show top salaries')">Top Salaries</button>
          <button onclick="runQuery('find data breach emails')">Data Breach</button>
          <button onclick="runQuery('list confidential emails')">Confidential</button>
          <button onclick="runQuery('show layoff plans')">Layoffs</button>
          <button onclick="runQuery('list all secrets')">All Secrets</button>
          <button onclick="runQuery('show customer credit cards')">Credit Cards</button>
          <button onclick="runQuery('find plaintext passwords')">Passwords</button>
          <button onclick="runQuery('show ceo emails')">CEO Comms</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const terminal = document.getElementById('terminal');
const input = document.getElementById('query-input');
const btn = document.getElementById('send-btn');

let queryCount = 0;
let foundSecrets = new Set();
const totalSecrets = 12;

// Secrets data
const secrets = [
  { id: 1, name: "CEO Affair", difficulty: "Medium", desc: "CEO having affair with HR Director. Paris trip planned." },
  { id: 2, name: "Project Phoenix Layoffs", difficulty: "Medium", desc: "15% workforce reduction planned for Q1 2025." },
  { id: 3, name: "Data Breach Cover-Up", difficulty: "Easy", desc: "15K customer records exposed, not reported." },
  { id: 4, name: "Vendor Kickback Scheme", difficulty: "Hard", desc: "Finance taking kickbacks from DataSync Partners." },
  { id: 5, name: "Plaintext Passwords", difficulty: "Easy", desc: "DB passwords shared in plaintext over email." },
  { id: 6, name: "Inflated Investor Metrics", difficulty: "Medium", desc: "CEO instructing CFO to mislead investors." },
  { id: 7, name: "Offshoring Plans", difficulty: "Medium", desc: "Support to Philippines, Engineering to Poland." },
  { id: 8, name: "Discrimination Complaint", difficulty: "Medium", desc: "Formal complaint filed against Engineering." },
  { id: 9, name: "Insider Trading", difficulty: "Hard", desc: "CFO selling pre-earnings, tipping family." },
  { id: 10, name: "Inflated Revenue Recognition", difficulty: "Hard", desc: "CFO/CEO manipulating revenue reporting." },
  { id: 11, name: "SSN/Credit Cards Exposed", difficulty: "Easy", desc: "Full PII included in CSV sent via email." },
  { id: 12, name: "Vendor Data Breach", difficulty: "Medium", desc: "DataSync Partners breached 12K NovaFi records." },
];

function renderSecrets() {
  const list = document.getElementById('secrets-list');
  list.innerHTML = '';
  let found = 0;
  for (const s of secrets) {
    const isFound = foundSecrets.has(s.id);
    if (isFound) found++;
    const div = document.createElement('div');
    div.className = `secret-item${isFound ? ' found' : ''}`;
    div.innerHTML = `<span>${isFound ? '🔓' : '🔒'}</span> ${s.name} <span class="diff ${s.difficulty.toLowerCase()}">[${s.difficulty}]</span><div class="desc">${isFound ? s.desc : '???'}</div>`;
    list.appendChild(div);
  }
  document.getElementById('stat-secrets').textContent = `${found}/${totalSecrets}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function checkSecrets(response) {
  const lower = (response || '').toLowerCase();
  for (const s of secrets) {
    if (foundSecrets.has(s.id)) continue;
    const keywords = s.name.toLowerCase().split(' ');
    const match = keywords.some(k => k.length > 3 && lower.includes(k));
    if (match) {
      foundSecrets.add(s.id);
      showToast(`🔓 SECRET DISCOVERED: ${s.name}`);
      renderSecrets();
    }
  }
}

function addLine(text, className = '') {
  const div = document.createElement('div');
  div.className = 'msg' + (className ? ' ' + className : '');
  div.textContent = text;
  terminal.appendChild(div);
  terminal.scrollTop = terminal.scrollHeight;
}

function addEmailResult(email) {
  const div = document.createElement('div');
  div.className = 'msg email-result';
  const sens = email.sensitivity === 'confidential' ? '<span class="label conf">CONF</span>' : '';
  const deptLabel = email.department ? `<span class="label ${email.department.toLowerCase().slice(0,3)}">${email.department.slice(0,3).toUpperCase()}</span>` : '';
  div.innerHTML = `${deptLabel}${sens} <b>${email.from_name}</b> → ${email.to_name}<br>Subject: ${email.subject}<br><span class="ts">${(email.timestamp || '').slice(0,19).replace('T', ' ')}</span>`;
  terminal.appendChild(div);
  terminal.scrollTop = terminal.scrollHeight;
}

function formatResponse(text) {
  const lines = text.split('\n');
  for (const line of lines) {
    const trimmed = line.trim();
    if (!trimmed) continue;
    let cls = '';
    if (trimmed.startsWith('>>> NOTE:')) cls = 'dim';
    else if (trimmed.startsWith('>>> WARNING:')) cls = 'warning';
    else if (trimmed.includes('[CONFIDENTIAL]')) cls = 'confidential';
    else if (trimmed.startsWith('>>> ACCESS') || trimmed.startsWith('>>> QUERY')) cls = 'info';
    else if (trimmed.startsWith('>>>')) cls = 'system';
    addLine(trimmed, cls);
  }
}

async function sendQuery(query) {
  if (!query.trim()) return;
  input.value = '';

  addLine(query, 'user');
  queryCount++;
  document.getElementById('stat-queries').textContent = queryCount;

  const loadingMsg = document.createElement('div');
  loadingMsg.className = 'msg dim';
  loadingMsg.id = 'loading-msg';
  loadingMsg.textContent = 'Processing';
  terminal.appendChild(loadingMsg);
  terminal.scrollTop = terminal.scrollHeight;

  try {
    const res = await fetch('/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, use_llm: false })
    });
    const data = await res.json();

    document.getElementById('loading-msg')?.remove();

    addLine(`[${data.intent.toUpperCase()}] ${data.emails_found} emails · ${data.records_found} records`, 'dim');
    document.getElementById('stat-emails').textContent = data.emails_found;
    document.getElementById('stat-records').textContent = data.records_found;

    formatResponse(data.response);

    for (const email of (data.top_emails || []).slice(0, 3)) {
      addEmailResult(email);
    }

    if (data.sql_results && data.sql_results.length > 0) {
      addLine('── Database Results ──', 'dim');
      for (const row of data.sql_results.slice(0, 5)) {
        addLine(JSON.stringify(row), 'system');
      }
    }

    checkSecrets(data.response);

  } catch (err) {
    document.getElementById('loading-msg')?.remove();
    addLine(`[CONNECTION ERROR] ${err.message}`, 'danger');
  }

  addLine('', 'dim');
}

function runQuery(q) {
  input.value = q;
  sendQuery(q);
}

// Event handlers
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendQuery(input.value);
});
btn.addEventListener('click', () => sendQuery(input.value));

// Init
renderSecrets();
addLine('NovaFi Phantom Terminal v2.1 — Connection established', 'system');
addLine('Type a query or click a suggestion. Find all 12 planted secrets.', 'dim');
addLine('', 'system');
</script>
</body>
</html>
